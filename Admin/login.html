<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="auth-container">
    <h1 class="page-title">Admin Portal</h1>
    <div class="card-box">
      <div class="form-section">
        <h2>Admin Sign In</h2>
        <div id="error-message" class="error-show" style="display: none;"></div>

        <form method="post" onsubmit="return validateLogin()" novalidate>
          <div class="input-grp">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <div class="error-text" id="email-error"></div>
          </div>

          <div class="input-grp">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <div class="error-text" id="password-error"></div>
          </div>

          <button type="submit" class="login-btn">Access Dashboard</button>
          <p class="switch-text">
            New staff or manager? <a href="admin-register.html">Register here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
