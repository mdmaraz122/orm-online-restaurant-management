<script>


function checkOrder() {

    let name = document.getElementById("name").value;
    let number = document.getElementById("number").value;

    if (name == "") {
        document.getElementById("nameMsg").innerHTML = "Enter your name";
    }
    else {
        document.getElementById("nameMsg").innerHTML = "";
    }

    if (number == "") {
        document.getElementById("numberMsg").innerHTML = "Enter your number";
    }
    else {
        document.getElementById("numberMsg").innerHTML = "";
    }

    if (name != "" && number != "") {
        document.getElementById("orderMsg").innerHTML = alert("Order placed successfully!");
    }
}


function countAddress() {
