<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Product | ORM - Online Restaurant Management</title>
    <link rel="stylesheet" href="maraz.css">
    <link rel="icon" href="logo.jpg" type="image/x-icon">
</head>

<body>
    <audio src="audio.wav" id="audio"></audio>
    <div id="notification-box" class="notification"></div>
    <header class="header">
        <div>
            <a href="#" class="logo">
                <h2>Online Restaurant <br><span>Management</span></h2>
            </a>
        </div>
        <nav class="header-btn">
            <a href="Admin/dashboard.html" class="btn text-primary">Dashboard</a>
            <a href="User-Management/user-management.html" class="btn text-primary">Users</a>
            <a href="categories.html" class="btn text-primary active">Categories</a>
            <a href="products.html" class="btn text-primary">Products</a>
            <a href="index.html" class="btn text-danger">Logout</a>
        </nav>
    </header>

    <section class="categories">
        <div class="container">
            <div class="container-header">
                <h1 class="text-center">View Product</h1>
            </div>

            <div class="text-right">
                <a href="products.html" class="btn text-primary">Back to Products</a>
            </div>

            <form>
                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" value="King Chicken Burger" readonly>
                </div>

                <div class="form-group">
                    <label for="product-category">Category</label>
                    <select id="product-category" disabled>
                        <option value="burger" selected>Burger</option>
                        <option value="pizza">Pizza</option>
                        <option value="pasta">Pasta</option>
                        <option value="drinks">Drinks</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product-purchase-price">Purchase Price ($)</label>
                    <input type="number" id="product-purchase-price" value="10.99" readonly>
                </div>

                <div class="form-group">
                    <label for="product-selling-price">Selling Price ($)</label>
                    <input type="number" id="product-selling-price" value="15.99" readonly>
                </div>

                <div class="form-group">
                    <label for="product-status">Status</label>
                    <select id="product-status" disabled>
                        <option value="active" selected>Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </form>
        </div>
    </section>

    <script src="maraz.js"></script>
</body>

</html>
