<!DOCTYPE html>
<html lang='en'>
<head>
    <title>User Management</title>
    <link rel="stylesheet" href="shihab.css">
</head>
<body>
    <h1>Online Restaurant Management</h1>
    <a href="dashboard.html">Dashboard</a> 
    <a href="user-management.html" class="active">User Management</a>
    <a href="contact-management.html">Contact Messages</a>            

    <form action="user-management.html" method="post" target="_blank" onsubmit="return saveUser()">
        <fieldset>
            <legend id="legend">Add User</legend>
            <table>
                <tr>
                    <td><label for="username">Full Name:</label></td>
                    <td><input type="text" id="username" name="username" placeholder="Enter Full Name"></td>
                </tr>

                <tr>
                    <td><label for="email">Email Address:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Enter Email" required></td>
                </tr>

                <tr>
                    <td><label for="userrole">User Role:</label></td>
                    <td>
                        <select id="userrole" name="userrole">
                            <option value="Customer">Customer</option>
                            <option value="Staff">Staff</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="userstatus">Status:</label></td>
                    <td>
                        <select id="userstatus" name="userstatus">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </td>
                </tr> 
                        
                <tr>
                    <td><button type="submit" id="submitBtn">Submit</button></td>
                    <td><button type="reset" onclick="resetForm()">Reset</button></td>
                </tr>
            </table>
           
            <p id="formMessage"></p>
        </fieldset>
    </form>

    <br>

    <h2>User List</h2>
    <table border="2" id="userTable">
        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        
        <tr>
            <td>USR-01</td>
            <td>Rahim Uddin</td>
            <td>rahim@gmail.com</td>
            <td>Customer</td>
            <td>Active</td>
            <td>
                <button type="button" class="btn" onclick="editUser(this)">Edit</button>
                <button type="button" class="btn" onclick="deleteUser(this)">Delete</button>
            </td>
        </tr>

        <tr>
            <td>USR-02</td>
            <td>Nadia Islam</td>
            <td>nadia@gmail.com</td>
            <td>Staff</td>
            <td>Active</td>
            <td>
                <button type="button" class="btn" onclick="editUser(this)">Edit</button>
                <button type="button" class="btn" onclick="deleteUser(this)">Delete</button>
            </td>
        </tr>
    </table>

    <script src="shihab.js"></script>
</body>
</html>
